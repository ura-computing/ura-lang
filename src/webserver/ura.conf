@name "webserver"
@version "0.0.1"

@dep "core":
    @url "https://github.com/ura-computing/ura-core"
    @version "0.0.1"
@dep "posix":
    @url "https://github.com/ura-computing/ura-posix"
    @version "0.0.1"

// ura run: compile and run
@script "run":
    @cmd "ura compile main.ura -ll -o build/webserver && ./build/webserver"
// ura build: compile into build/webserver
@script "build":
    @cmd "ura compile main.ura -o build/webserver"

// ura compile flags, add them to a script:
//   -o <exe>    name the executable (default build/exe.out)
//   -ll [path]  also write the LLVM IR (default build/out.ll)
//   -S [path]   write the assembly, no executable (default build/out.s)
//   -c [path]   write the object file, no executable (default build/out.o)
